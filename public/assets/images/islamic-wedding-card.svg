<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient: Deep Royal Burgundy to Warm Twilight -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24040d" />
      <stop offset="40%" stop-color="#4a0d1d" />
      <stop offset="75%" stop-color="#73162f" />
      <stop offset="100%" stop-color="#9e2d45" />
    </linearGradient>

    <!-- Celestial Moon and Golden Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#fff9e6" stop-opacity="1" />
      <stop offset="25%" stop-color="#f5d378" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#c59b27" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c59b27" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradient for Archway -->
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcedc5" />
      <stop offset="20%" stop-color="#dfba73" />
      <stop offset="50%" stop-color="#fff6db" />
      <stop offset="80%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#fcedc5" />
    </linearGradient>

    <!-- Lantern Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Crescent Moon Gradient -->
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbee" />
      <stop offset="100%" stop-color="#e0be77" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="520" fill="url(#skyGrad)" />

  <!-- Celestial Glow -->
  <circle cx="400" cy="210" r="230" fill="url(#sunGlow)" />

  <!-- Elegant Islamic Crescent Moon & Star -->
  <g transform="translate(375, 120) scale(1.1)" filter="url(#softGlow)">
    <path d="M 25 0 A 25 25 0 1 0 50 45 A 28 28 0 1 1 25 0 Z" fill="url(#crescentGrad)" />
    <polygon points="38,20 40,26 46,26 41,30 43,36 38,32 33,36 35,30 30,26 36,26" fill="#fffbee" />
  </g>

  <!-- Distant Mosque Silhouettes with Domes & Minarets -->
  <g fill="#1a0208" opacity="0.92">
    <!-- Center Grand Dome -->
    <path d="M 330 360 C 330 280, 365 230, 400 200 C 435 230, 470 280, 470 360 Z" />
    <rect x="325" y="360" width="150" height="160" />
    <path d="M 397 195 L 403 195 L 400 170 Z" fill="#dfba73" />
    <circle cx="400" cy="168" r="3" fill="#dfba73" />

    <!-- Left Minaret -->
    <rect x="175" y="220" width="22" height="300" />
    <path d="M 172 220 L 197 220 L 186 165 Z" />
    <circle cx="186" cy="162" r="3.5" fill="#dfba73" />
    <rect x="170" y="270" width="32" height="6" fill="#dfba73" opacity="0.6" />

    <!-- Right Minaret -->
    <rect x="603" y="220" width="22" height="300" />
    <path d="M 600 220 L 625 220 L 614 165 Z" />
    <circle cx="614" cy="162" r="3.5" fill="#dfba73" />
    <rect x="598" y="270" width="32" height="6" fill="#dfba73" opacity="0.6" />

    <!-- Flanking Domes -->
    <path d="M 235 370 C 235 320, 260 275, 280 255 C 300 275, 325 320, 325 370 Z" />
    <path d="M 475 370 C 475 320, 500 275, 520 255 C 540 275, 565 320, 565 370 Z" />
  </g>

  <!-- Foreground Ornate Islamic Multi-Foil Archway -->
  <g fill="#120105">
    <path d="M 0 0 L 800 0 L 800 520 L 730 520 L 730 230 C 730 230, 630 80, 400 35 C 170 80, 70 230, 70 230 L 70 520 L 0 520 Z" />
  </g>

  <!-- Golden Arch Moldings & Arabesque Cusps -->
  <path
    d="M 70 230 C 130 195, 190 135, 275 95 C 325 70, 375 45, 400 35 C 425 45, 475 70, 525 95 C 610 135, 670 195, 730 230"
    stroke="url(#goldArch)"
    stroke-width="6"
    fill="none"
    filter="url(#softGlow)"
  />
  <path
    d="M 85 245 C 145 210, 205 150, 285 110 C 330 85, 375 60, 400 50 C 425 60, 470 85, 515 110 C 595 150, 655 210, 715 245"
    stroke="#dfba73"
    stroke-width="2"
    fill="none"
    opacity="0.85"
  />

  <!-- Hanging Ornate Royal Lanterns (Fanoos) -->
  <g>
    <!-- Left Hanging Lantern -->
    <line x1="186" y1="0" x2="186" y2="175" stroke="#dfba73" stroke-width="2" />
    <circle cx="186" cy="195" r="45" fill="url(#sunGlow)" opacity="0.75" />
    <path d="M 170 175 L 202 175 L 212 205 L 186 240 L 160 205 Z" fill="#25040c" stroke="#dfba73" stroke-width="2.5" />
    <circle cx="186" cy="202" r="6" fill="#fff9e6" filter="url(#softGlow)" />
    <!-- Delicate Filigree on Lantern -->
    <line x1="186" y1="175" x2="186" y2="240" stroke="#dfba73" stroke-width="1.2" opacity="0.7" />

    <!-- Right Hanging Lantern -->
    <line x1="614" y1="0" x2="614" y2="175" stroke="#dfba73" stroke-width="2" />
    <circle cx="614" cy="195" r="45" fill="url(#sunGlow)" opacity="0.75" />
    <path d="M 598 175 L 630 175 L 640 205 L 614 240 L 588 205 Z" fill="#25040c" stroke="#dfba73" stroke-width="2.5" />
    <circle cx="614" cy="202" r="6" fill="#fff9e6" filter="url(#softGlow)" />
    <!-- Delicate Filigree on Lantern -->
    <line x1="614" y1="175" x2="614" y2="240" stroke="#dfba73" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- Ornate Golden Base Trim -->
  <g stroke="#dfba73" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 70 510 C 200 495, 300 500, 400 495 C 500 500, 600 495, 730 510" />
    <circle cx="400" cy="495" r="5" fill="#dfba73" />
    <circle cx="250" cy="498" r="3.5" fill="#dfba73" />
    <circle cx="550" cy="498" r="3.5" fill="#dfba73" />
  </g>
</svg>
